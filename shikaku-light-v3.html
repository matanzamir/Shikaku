<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shikaku — Light Mode Mockup v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SHIKAKU — DESIGN TOKENS (LIGHT MODE, v3)

   Rectangles are now drawn as inset shapes that sit inside their
   cells rather than filling them edge-to-edge — cells belonging
   to the same rectangle are flush against each other (no gap, no
   radius on that side); the rectangle's true outer edges get a
   margin + border + rounded corner. Adjacent rectangles therefore
   always show a visible gap between them, even if same status.

   Status is communicated by fill/border TREATMENT, one hue only:
     valid    -> filled solid + solid border
     invalid  -> outline only, no fill
     selected -> dashed outline + faint tint (in progress)
   ============================================================ */
:root{
  --bg-top:#ecd2dc;
  --bg-mid:#cf6d97;
  --bg-bottom:#ad3b74;

  --surface:#fbf4f2;
  --surface-border:#e3c7d0;
  --surface-border-strong:#d7abbb;

  --ink:#2a1826;
  --ink-soft:#7a5568;

  --primary:#7a3350;
  --primary-deep:#5a2339;
  --primary-rgb:122,51,80;
  --on-primary:#fbf1f4;

  --cell-empty:#f4e8ec;
  --grid-line:#e9d6de;

  --shadow-soft: 0 14px 30px rgba(96,25,58,0.16);
  --shadow-tight: 0 4px 10px rgba(96,25,58,0.14);
  --radius-lg: 22px;
  --radius-md: 14px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(ellipse 1400px 900px at 50% -5%, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-bottom) 100%);
  position:relative;
  overflow-x:hidden;
}

/* ---------- theme toggle ---------- */
.theme-toggle{
  position:absolute; top:36px; right:44px;
  width:46px; height:46px; border-radius:50%;
  border:1.5px solid var(--surface-border-strong);
  background:var(--surface); color:var(--primary);
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow-tight);
  cursor:pointer;
}
.theme-toggle svg{ width:22px; height:22px; }

/* ---------- title ---------- */
.title-wrap{ padding-top:64px; text-align:center; }
.title{
  margin:0;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700; font-size:58px; letter-spacing:0.1em;
  color:var(--ink);
}
.title span{ color:var(--primary); }

/* ---------- controls row ---------- */
.controls{
  margin-top:30px; display:flex; align-items:center;
  justify-content:center; gap:22px; flex-wrap:wrap;
}
.btn-icon{
  width:40px; height:40px; border-radius:50%;
  border:1.5px solid var(--surface-border-strong);
  background:var(--surface); color:var(--primary);
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow-tight);
  cursor:pointer;
}
.btn-icon svg{ width:17px; height:17px; }

.timer-chip{
  display:flex; align-items:center; gap:12px;
  padding:8px 8px 8px 18px; border-radius:999px;
  border:1.5px solid var(--surface-border-strong);
  background:var(--surface); box-shadow:var(--shadow-tight);
}
.timer-digits{
  font-family:'JetBrains Mono',monospace;
  font-weight:600; font-size:19px; letter-spacing:0.03em;
  color:var(--ink); min-width:64px; text-align:center;
}
.btn-play{
  width:34px; height:34px; border-radius:50%; border:none;
  background:var(--primary); color:var(--on-primary);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:0 4px 10px rgba(122,51,80,0.4);
}
.btn-play svg{ width:14px; height:14px; margin-left:2px; }

.difficulty{
  display:flex; align-items:center; gap:10px;
  padding:11px 18px; border-radius:999px;
  border:1.5px solid var(--surface-border-strong);
  background:var(--surface); box-shadow:var(--shadow-tight);
  cursor:pointer;
}
.difficulty .dot{ width:8px; height:8px; border-radius:2px; background:var(--primary); transform:rotate(45deg); }
.difficulty-label{ font:600 14px 'Inter',sans-serif; color:var(--ink); }
.difficulty svg{ width:14px; height:14px; color:var(--ink-soft); }

/* ---------- board ---------- */
.board-wrap{ margin-top:40px; display:flex; justify-content:center; }
.board-card{
  background:var(--surface);
  border:1.5px solid var(--surface-border);
  border-radius:var(--radius-lg);
  padding:16px;
  box-shadow:var(--shadow-soft);
}
.board-grid{
  display:grid;
  grid-template-columns:repeat(5, 82px);
  grid-template-rows:repeat(5, 82px);
  background:var(--cell-empty);
  border-radius:var(--radius-md);
  overflow:hidden;
}
.cell{
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--grid-line);
  background:var(--cell-empty);
  font-family:'JetBrains Mono',monospace;
  font-weight:700; font-size:20px;
  color:var(--ink);
}

/* rectangle shapes: inset from cell edge, flush only where the
   side touches another cell of the SAME rectangle */
.shape{ border:none; }

.valid{ background:var(--primary); color:var(--on-primary); }
.invalid{ background:var(--cell-empty); color:var(--ink); }
.selected{ background:rgba(var(--primary-rgb),0.12); color:var(--ink); }

/* ---------- legend ---------- */
.legend{ margin-top:22px; display:flex; justify-content:center; gap:28px; }
.legend-item{ display:flex; align-items:center; gap:9px; font:500 12.5px 'Inter',sans-serif; color:var(--ink-soft); }
.swatch{ width:20px; height:20px; border-radius:6px; }
.swatch.valid{ background:var(--primary); border:2px solid var(--primary-deep); }
.swatch.invalid{ background:var(--cell-empty); border:2px solid var(--primary); }
.swatch.selected{ background:rgba(var(--primary-rgb),0.12); border:2px dashed var(--primary); }

/* ---------- drawer handle — moderate wave, not a half circle ---------- */
.drawer-handle{
  position:fixed; right:0; top:50%; transform:translateY(-50%);
  width:26px; height:120px;
  border:none; background:transparent; padding:0;
  cursor:pointer; z-index:20;
}
.drawer-handle svg{
  width:100%; height:100%;
  filter: drop-shadow(-4px 5px 12px rgba(96,25,58,0.2));
}
</style>
</head>
<body>

  <button class="theme-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/>
    </svg>
  </button>

  <div class="title-wrap">
    <h1 class="title">SHIK<span>AKU</span></h1>
  </div>

  <div class="controls">
    <button class="btn-icon" title="Reset puzzle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.8-6.5"/>
        <path d="M21 3.5V9h-5.5"/>
      </svg>
    </button>

    <div class="timer-chip">
      <span class="timer-digits">00:43</span>
      <button class="btn-play">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>
      </button>
    </div>

    <div class="difficulty">
      <span class="dot"></span>
      <span class="difficulty-label">Hard</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,9 12,15 18,9"/></svg>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board-card">
      <div class="board-grid">

        <!-- Row 1 : invalid rectangle (1,1)-(1,3) — outline only, clue 4, area 3 -->
        <div class="cell shape invalid" style="margin:6px 0 6px 6px; border-radius:12px 0 0 12px; border-top:2px solid var(--primary); border-left:2px solid var(--primary); border-bottom:2px solid var(--primary);">4</div>
        <div class="cell shape invalid" style="margin:6px 0; border-top:2px solid var(--primary); border-bottom:2px solid var(--primary);"></div>
        <div class="cell shape invalid" style="margin:6px 6px 6px 0; border-radius:0 12px 12px 0; border-top:2px solid var(--primary); border-right:2px solid var(--primary); border-bottom:2px solid var(--primary);"></div>
        <div class="cell">2</div>
        <div class="cell"></div>

        <!-- Row 2 -->
        <div class="cell"></div>
        <div class="cell shape valid" style="margin:6px 6px 0 6px; border-radius:12px 12px 0 0; border-top:2px solid var(--primary-deep); border-left:2px solid var(--primary-deep); border-right:2px solid var(--primary-deep);"></div>
        <div class="cell shape valid" style="margin:6px 6px 0 6px; border-radius:12px 12px 0 0; border-top:2px solid var(--primary-deep); border-left:2px solid var(--primary-deep); border-right:2px solid var(--primary-deep);"></div>
        <div class="cell"></div>
        <div class="cell">4</div>

        <!-- Row 3 : two adjacent valid rectangles, V1 col2 / V2 col3, gap between them -->
        <div class="cell"></div>
        <div class="cell shape valid" style="margin:0 6px; border-left:2px solid var(--primary-deep); border-right:2px solid var(--primary-deep);">3</div>
        <div class="cell shape valid" style="margin:0 6px; border-left:2px solid var(--primary-deep); border-right:2px solid var(--primary-deep);"></div>
        <div class="cell"></div>
        <div class="cell shape selected" style="margin:6px; border-radius:12px; border:2px dashed var(--primary);"></div>

        <!-- Row 4 -->
        <div class="cell"></div>
        <div class="cell shape valid" style="margin:0 6px 6px 6px; border-radius:0 0 12px 12px; border-left:2px solid var(--primary-deep); border-right:2px solid var(--primary-deep); border-bottom:2px solid var(--primary-deep);"></div>
        <div class="cell shape valid" style="margin:0 6px 6px 6px; border-radius:0 0 12px 12px; border-left:2px solid var(--primary-deep); border-right:2px solid var(--primary-deep); border-bottom:2px solid var(--primary-deep);">3</div>
        <div class="cell">4</div>
        <div class="cell"></div>

        <!-- Row 5 -->
        <div class="cell">3</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell">2</div>
      </div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="swatch valid"></span>Valid rectangle</div>
    <div class="legend-item"><span class="swatch invalid"></span>Invalid rectangle</div>
    <div class="legend-item"><span class="swatch selected"></span>Selected cell</div>
  </div>

  <button class="drawer-handle">
    <svg viewBox="0 0 26 120" xmlns="http://www.w3.org/2000/svg">
      <path d="M26,0 C14,0 8,20 8,60 C8,100 14,120 26,120 Z"
            fill="var(--surface)" stroke="var(--surface-border-strong)" stroke-width="1.5"/>
      <polyline points="15,50 9,60 15,70" fill="none" stroke="var(--primary)"
                stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

</body>
</html>
