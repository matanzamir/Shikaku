<!DOCTYPE html>
<html>
    <head>
        <!-- <link rel="icon" href="Resources/Images/logo.png" type="image/png"> -->
        <link rel="stylesheet" href="css/variables.css">
        <link rel="stylesheet" href="css/layout.css">
        <link rel="stylesheet" href="css/components.css">
        <link rel="stylesheet" href="css/gameStates.css">
        <!-- <link rel="stylesheet" href="FONT"> -->
        <title>Shikaku</title>
    </head>

    <body>
        <header class="top-bar">
            <h1 class="logo" id="shikaku">SHIKAKU</h1>
        </header>
        <div id="game-wrapper">
            <main class="game-area">
                <div id="control-bar">
                    <div id="timer">
                        <span id="minutes">00</span>:<span id="seconds">00</span>
                        <button id="pause-button">Pause</button>
                    </div>
                </div>  
                <div id="game-block">
                    <div id="game-grid">

                    </div>
                </div>
            </main>
        </div>
        <aside id="settings-drawer" class="drawer" hidden></aside>
        <aside id="help-drawer" class="drawer" hidden></aside>
        <div id="win-overlay" class="win-overlay" hidden></div>
        <script type="module" src="js/main.js"></script>
    </body>
