<!DOCTYPE html>
<html>
    <head>
        <!-- <link rel="icon" href="Resources/Images/logo.png" type="image/png"> -->
        <script>
            document.documentElement.dataset.theme =
                localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        </script>
        <link rel="stylesheet" href="css/variables.css">
        <link rel="stylesheet" href="css/layout.css">
        <link rel="stylesheet" href="css/components.css">
        <link rel="stylesheet" href="css/gameStates.css">
        <link rel="stylesheet" href="css/drawer.css">
        <!-- <link rel="stylesheet" href="FONT"> -->
        <title>Shikaku</title>
    </head>

    <body>
        <button id="light-dark-button" type="button">Dark Mode</button>
        <div id="main-container">
            <header class="top-bar">
                <h1 class="logo" id="shikaku">SHIKAKU</h1>
            </header>
            <div id="game-wrapper">
                <main class="game-area">
                    <div id="control-bar">
                        <button id="reset-board-button">reset</button>
                        <div id="timer">
                            <span id="minutes">00</span>:<span id="seconds">00</span>
                            <button id="pause-button"></button>
                        </div>
                        <select id="difficulty-select">
                        </select>
                    </div>  
                    <div id="game-block">
                        <div id="game-grid">

                        </div>
                    </div>
                </main>
            </div>
        </div>
        <aside id="settings-drawer" class="drawer">
            <div class="drawer-open-close-button" id="drawer-button">
                <svg class="drawer-bump" viewBox="0 0 50 100">
                    <path d="M 50 0 C 50 42 0 40 0 50 C 0 60 50 58 50 100 Z"/>
                </svg>
                <span class="drawer-button">&lt;</span>
            </div>
            <div class="drawer-content-wrapper">
                <div class="drawer-content">
                    <div id="instructions">
                        <div id="instructions-loader">
                            <h3>Don't know how to play? click here</h3>
                            <button id="instructions-button" type="button">Instructions</button>
                        </div>
                        <div id="instructions-content" hidden>
                            <div id="slide-buttons">
                                <button id="slide-left" class="slide-button" type="button">&lt;</button>
                                <button id="slide-right" class="slide-button" type="button">&gt;</button>
                            </div>
                            <div id="instructions-slide"></div>
                            <div id="slide-indicators"></div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
        <div id="win-overlay" class="win-overlay" hidden></div>
        <div id="alert-box" class="alert-box" hidden>
            <div class="box-content">
                <h3 id="message"></h3>
                <div class="modal-buttons">
                    <button id="cancel-btn" type="button">Cancel</button>
                    <button id="ok-btn" type="button">OK</button>
                </div>
            </div>
        </div>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
